# Живое демо: настоящая модель + инструменты, но первый вызов enrich_target падает по таймауту
# (имитация сбоя SEC). Агент должен сам повторить вызов и продолжить.
provider = "openai_compatible"
model = "qwen/qwen3.8-27b"
api_key_env = "API_KEY"
base_url_env = "API_LINK"

max_tokens = 4000
max_steps = 8
tool_timeout_s = 20
result_max_chars = 6000
max_intro_requests = 3

network = "data/demo/network.json"
targets_dir = "data/demo/targets"
outbox_dir = "data/outbox"
enrichment = "snapshot"
simulate_enrichment_failures = 1
