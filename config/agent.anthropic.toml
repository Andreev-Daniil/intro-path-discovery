# Альтернативный конфиг: Claude через официальный SDK Anthropic.
# Ключ API здесь НЕ хранится: ANTHROPIC_API_KEY в окружении или профиль `ant auth login`.
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"           # low | medium | high | xhigh | max
fallbacks = true            # серверный запасной маршрут, если классификатор безопасности отказал

max_steps = 8
tool_timeout_s = 20
result_max_chars = 6000
max_intro_requests = 3

network = "data/demo/network.json"
targets_dir = "data/demo/targets"
outbox_dir = "data/outbox"
enrichment = "snapshot"
