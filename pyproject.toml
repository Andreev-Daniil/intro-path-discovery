[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intro-paths"
version = "0.1.0"
description = "Поиск путей знакомства по экспорту LinkedIn: импорт контактов, граф связей и ранжирование"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "jsonschema>=4.20", "openai>=1.40", "anthropic>=1.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.40", "pyvis>=0.3.2", "python-dotenv>=1.0"]
live = ["open-linkedin-api", "python-dotenv>=1.0"]

[project.scripts]
intro-paths = "intro_paths.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
